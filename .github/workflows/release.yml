name: Release

# Two ways in. The everyday one is the button: Actions > Release > Run workflow, pick a bump
# level, and this does the version bump, the commit, the tag and the release itself — nothing
# to do locally, and no second place to keep in sync. Equivalently,
# `gh workflow run release.yml -f bump=patch`.
#
# Pushing a tag by hand still releases, for a release prepared locally. That path cannot be
# folded into the first one: a push made with the default GITHUB_TOKEN deliberately does not
# trigger further workflows, so a job that pushed a tag would never set off a tag-triggered
# release. Hence one workflow that both creates the tag and releases it.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Exact version instead, e.g. 0.4.0 (wins over the bump level)
        type: string

  push:
    tags: ['v*']

# Two releases at once would race on the tag and on the version bump.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Tests run before anything is tagged, so a failing tree cannot become a release. On the
  # manual path this is what stands between a button press and a bad version being published.
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/ClaudeUsageWidget.Tests -c Release

  # Settles what version is being released, and on the manual path brings the repository to
  # it. Both paths end with a tag that exists and a csproj that agrees with it.
  prepare:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The bump commit belongs on the default branch, not on the detached HEAD a tag
          # push checks out.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - id: resolve
        env:
          EVENT: ${{ github.event_name }}
          BUMP: ${{ inputs.bump }}
          EXPLICIT: ${{ inputs.version }}
          PUSHED_TAG: ${{ github.ref_name }}
        # Outputs are written to $GITHUB_OUTPUT from inside the script, not by redirecting it:
        # git prints to stdout too, and its "[master abc] Release 0.3.1" would land in the
        # output file as an invalid line.
        run: |
          python3 - <<'PY'
          import os, pathlib, re, subprocess

          out = pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a")
          emit = lambda **kw: [print(f"{k}={v}", file=out) for k, v in kw.items()]

          csproj = pathlib.Path("ClaudeUsageWidget.csproj")
          text = csproj.read_text(encoding="utf-8")
          current = re.search(r"<Version>(.+?)</Version>", text).group(1)

          if os.environ["EVENT"] == "push":
              # The tag is the claim; the csproj has to back it up. Shipping a binary that
              # reports a version other than its tag is not worth the debugging it costs.
              version = os.environ["PUSHED_TAG"].removeprefix("v")
              if version != current:
                  raise SystemExit(
                      f"::error::tag v{version} does not match csproj version {current}"
                  )
              emit(tag=f"v{version}", version=version)
              raise SystemExit(0)

          explicit = os.environ.get("EXPLICIT", "").strip().removeprefix("v")
          if explicit:
              if not re.fullmatch(r"\d+\.\d+\.\d+", explicit):
                  raise SystemExit(f"::error::'{explicit}' is not a X.Y.Z version")
              version = explicit
          else:
              major, minor, patch = (int(p) for p in current.split("."))
              bump = os.environ["BUMP"]
              if bump == "major":
                  major, minor, patch = major + 1, 0, 0
              elif bump == "minor":
                  minor, patch = minor + 1, 0
              else:
                  patch += 1
              version = f"{major}.{minor}.{patch}"

          tag = f"v{version}"
          existing = subprocess.run(
              ["git", "tag", "--list", tag], capture_output=True, text=True, check=True
          ).stdout.split()
          if existing:
              raise SystemExit(f"::error::{tag} already exists")
          if version == current:
              raise SystemExit(f"::error::{version} is already the current version")

          csproj.write_text(
              text.replace(f"<Version>{current}</Version>", f"<Version>{version}</Version>", 1),
              encoding="utf-8",
          )

          # [skip ci] because the push-to-master CI run would only re-test what this workflow
          # just tested, one commit earlier.
          run = lambda *args: subprocess.run(args, check=True)
          run("git", "config", "user.name", "github-actions[bot]")
          run("git", "config", "user.email",
              "41898282+github-actions[bot]@users.noreply.github.com")
          run("git", "commit", "-am", f"Release {version} [skip ci]")
          run("git", "tag", "-a", tag, "-m", f"claude-usage-widget {version}")
          run("git", "push", "--follow-tags")

          emit(tag=tag, version=version)
          PY

  build:
    needs: prepare
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Put vswhere on PATH
        run: echo "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer" >> $env:GITHUB_PATH
      - run: dotnet publish -c Release -r ${{ matrix.rid }} -o publish

      # Two shapes of the same binary. The bare .exe is what most people want; the zip exists
      # because browsers and corporate filters block a downloaded .exe far more often than a
      # zip, and it carries the licence and README with it.
      - name: Package
        env:
          RID: ${{ matrix.rid }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          New-Item -ItemType Directory assets | Out-Null
          Copy-Item publish\ClaudeUsageWidget.exe "assets\ClaudeUsageWidget-$env:RID.exe"

          New-Item -ItemType Directory staging | Out-Null
          Copy-Item publish\ClaudeUsageWidget.exe, README.md, LICENSE staging\
          Compress-Archive staging\* "assets\ClaudeUsageWidget-$env:VERSION-$env:RID.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: assets/

  github-release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/

      # The exe is unsigned, so SmartScreen will warn on first run. A published checksum is
      # the only thing a downloader can verify against.
      - name: Checksum every asset
        run: cd dist && sha256sum * > SHA256SUMS.txt

      # The notes are the commit subjects since the previous tag, plus the one thing a reader
      # actually needs: which file to download and how to check it.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          previous=$(git tag --sort=-version:refname | grep -A1 -x "$TAG" | tail -n1)
          {
            echo "Windows only. Download the \`win-x64\` build unless you are on an Arm device."
            echo
            echo "| | Run it directly | Zipped, with README and licence |"
            echo "|---|---|---|"
            echo "| **Intel / AMD** | \`ClaudeUsageWidget-win-x64.exe\` | \`…-win-x64.zip\` |"
            echo "| **Arm** | \`ClaudeUsageWidget-win-arm64.exe\` | \`…-win-arm64.zip\` |"
            echo
            echo "No installer and no .NET runtime — it is a single self-contained binary."
            echo "It is unsigned, so SmartScreen will ask once. Checksums are in"
            echo "\`SHA256SUMS.txt\`:"
            echo
            echo '```powershell'
            echo '(Get-FileHash .\ClaudeUsageWidget-win-x64.exe -Algorithm SHA256).Hash.ToLower()'
            echo '```'
            echo
            echo "## Changes"
            echo
            if [ -n "$previous" ] && [ "$previous" != "$TAG" ]; then
              git log --no-merges --pretty='- %s' "${previous}..${TAG}"
            else
              git log --no-merges --pretty='- %s' "$TAG"
            fi
          } > notes.md
          gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md
